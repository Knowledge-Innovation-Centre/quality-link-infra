version: '3.8'

services:

  frontend:
    build:
      context: ./03_frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_API_URL: ${VITE_API_URL}
        VITE_RECAPTCHA_ENABLED: ${VITE_RECAPTCHA_ENABLED:-true}
    healthcheck:
      test: [ "CMD", "wget", "-O/dev/null", "-q", "http://localhost:3000" ]
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
      VITE_RECAPTCHA_ENABLED: ${VITE_RECAPTCHA_ENABLED:-true}
    depends_on:
      - backend

  postgres:
    build: ./00_postgres
    environment:
      POSTGRES_USER: quality_link
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backend
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5432" ]
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=512MB

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address "0.0.0.0:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f" , "http://localhost:9001" ]
    expose:
      - "9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./02_backend
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/database', timeout=3)" ]
    expose:
      - "8000"
    environment:
      DB_USER: quality_link
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: backend
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-quality-link-storage}
      FUSEKI_USERNAME: admin
      FUSEKI_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET_NAME: ${FUSEKI_DATASET_NAME:-qualitylink}
      MEILISEARCH_URL: http://meili:7700
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-ql_courses}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_SEARCH_KEY: ${MEILISEARCH_SEARCH_KEY}
      SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-100}
      SKILLDATA_API_URL: ${SKILLDATA_API_URL}
      SKILLDATA_API_KEY: ${SKILLDATA_API_KEY}
      SKILLDATA_API_TIMEOUT: ${SKILLDATA_API_TIMEOUT:-60}
      SKILLDATA_SKILL_LIMIT: ${SKILLDATA_SKILL_LIMIT:-5}
      SKILLDATA_MAX_DISTANCE: ${SKILLDATA_MAX_DISTANCE:-0.3}
      ETER_API_URL: ${ETER_API_URL:-https://eter-project.com/api/4.0/}
      ETER_API_TIMEOUT: ${ETER_API_TIMEOUT:-120}
    depends_on:
      - postgres
      - minio
      - fuseki
      - meili
    restart: unless-stopped

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xmx2g -XX:+UseContainerSupport}
      ENABLE_UPDATE: ${FUSEKI_ENABLE_UPDATE:-true}
      ENABLE_DATA_WRITE: ${FUSEKI_ENABLE_DATA_WRITE:-true}
      TDB: ${FUSEKI_TDB:-2}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET_NAME:-qualitylink}
    volumes:
      - fuseki_data:/fuseki
    restart: unless-stopped
    expose:
      - "3030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  meili:
    image: getmeili/meilisearch:v1.49
    healthcheck:
      test: [ "CMD", "curl", "-f" , "http://localhost:7700" ]
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: production

volumes:
  fuseki_data:
  postgres_data:
  minio_data:
  meili_data:

